name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_url:
        description: "Deployed base URL to run the live end-to-end check against"
        required: false
        default: "https://cart-transfer-redirect.vercel.app"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  live-check:
    runs-on: ubuntu-latest
    needs: test
    env:
      LIVE_URL: ${{ github.event.inputs.live_url || 'https://cart-transfer-redirect.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Live end-to-end check against the deployed instance
        run: node scripts/live-check.mjs "$LIVE_URL"
