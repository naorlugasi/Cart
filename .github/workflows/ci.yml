name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_url:
        description: "Deployed base URL to run the live end-to-end check against"
        required: false
        default: "https://cart-transfer-redirect.vercel.app"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Manual only. The script drives the whole flow through the demo store, but it was written against the
  # frozen demo fixture (product ids cucumber / milk-3 / bamba, a "3 ב-10" promo, a missing beer) and
  # production has served the real catalogs since 9.9 - so it failed on every push from then on and mailed
  # a red run for each one. Running it on push was also a race against the Vercel deploy of the same commit.
  # Run it from the Actions tab when you want it; docs/TODO.md §8 has the rewrite against real data.
  live-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    env:
      LIVE_URL: ${{ github.event.inputs.live_url || 'https://cart-transfer-redirect.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Live end-to-end check against the deployed instance
        run: node scripts/live-check.mjs "$LIVE_URL"
