name: Site analysis

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Site to analyze"
        required: true
      max_pages:
        description: "Max internal pages to follow"
        required: false
        default: "8"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Analyze
        run: node scripts/site-analysis.mjs "${{ github.event.inputs.url }}" --max-pages "${{ github.event.inputs.max_pages }}" --out analysis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis
          path: analysis/
          retention-days: 7
