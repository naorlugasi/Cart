 כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested":"להשאיר","collapsedDefault":false},{"id":"kind:oil-coconut","section":1,"title":"שמן קוקוס (oil-coconut)","meta":"22 מוצרים · שימורים (מזווה) · kinds/medium","body":"refined: (?<!לא )מזוככ\n\nשמן קוקוס לא מזוכך (טעם/ריח קוקוס) מול מזוכך (נטול טעם, לבישול בחום גבוה) - הבדל תפקודי אמיתי, כמו ב-oil-olive. \"לא מזוכך\" מוחרג מהתבנית כדי שלא יזוהה כ\"מזוכך\".","options":["להכניס","להכניס כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested":null,"collapsedDefault":false},{"id":"kind:rice-brown","section":1,"title":"אורז מלא (rice-brown)","meta":"21 מוצרים · שימורים (מזווה) · kinds/medium","body":"noodles: אטריות\npuffed: פצפוצי\n\nחלק מהמוצרים שתויגו לאורז מלא הם בפועל אטריות אורז מלא (צורת מוצר שונה בתכלית מגרגר אורז) או אורז נפוח/פצפוצים (חטיף) - לא ניתן להשתמש בהם כאורז לבישול.","options":["להכניס","להכניס כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested":"להכניס","collapsedDefault":false},{"id":"kind:curry-paste","section":1,"title":"ממרח קארי (curry-paste)","meta":"19 מוצרים · שימורים (מזווה) · kinds/medium","body":"red: אדומ\ngreen: ירוק\nyellow: צהוב\nmassaman: מסמאנ, סמאמנ\n\nמחיות קארי תאילנדיות אדום/ירוק/צהוב/מסמן הן מוצרים שונים בתכלית הטעם וההרכב (צ'ילי/גלנגל לעומת כורכום) ומזוהות במתכונים כקטגוריות נפרדות - לא כמו \"טעם\" חלופי.","options":["להכניס","להכניס כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested":"להכניס","collapsedDefault":false},{"id":"kind:surimi","section":1,"title":"נתחי סורימי (surimi)","meta":"14 מוצרים · ירקות ופירות / חלב וביצים / בשר ועוף / מעדנייה · unsure/medium","body":"sticks: מקלות\nchunks: (?<![א-ת])נתח\n\nמקלות (crab sticks, for sushi/rolls) vs נתחי (chunks, for salads) is a real use-case split, though it borders on 'form' which is usually excluded; flagging as unsure rather than committing.","options":["להכניס","להכניס כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested":"להשאיר","collapsedDefault":false},{"id":"kind:chicken-ground","section":1,"title":"עוף טחון (chicken-ground)","meta":"9 מוצרים · ירקות ופירות / חלב וביצים / בשר ועוף / מעדנייה · kinds/medium","body":"breast: חזה\n\nחזה עוף טחון (ground chicken breast) is called out by cut on over half the listings; the rest are unlabeled generic ground chicken (likely thigh/mixed) - lean vs regular is a cut a shopper picks deliberately.","options":["להכניס","להכניס כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested":null,"collapsedDefault":false},{"id":"kind:shawarma-meat","section":1,"title":"שווארמה (shawarma-meat)","meta":"9 מוצרים · ירקות ופירות / חלב וביצים / בשר ועוף / מעדנייה · kinds/medium","body":"turkey: הודו\nbeef: אנטריקוט, (?<![א-ת])בקר\nchicken: פרגית\n\nListings split by species/cut: turkey (הודו), beef entrecote-cut shawarma (אנטריקוט/בקר), and chicken thigh (פרגית) - a shopper buying beef shawarma meat would not accept turkey. Note: 'מכשיר שווארמה TB2022A BOSS' in this concept is a shawarma rotisserie MACHINE, not food - miscategorized product, not a kind.","options":["להכניס","להכניס כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested":"להכניס","collapsedDefault":false},{"id":"kind:butter","section":1,"title":"חמאה (butter)","meta":"49 מוצרים · ירקות ופירות / חלב וביצים / בשר ועוף / מעדנייה · unsure/low","body":"spreadable: ממרח, למריחה\n\nSoft spreadable butter blends (ממרח/רכה למריחה, e.g. Lurpak-style) are formulated to stay soft from the fridge, unlike hard block butter used for baking/lamination; share is modest (~16%) so flagging as unsure. Unsalted/salted is already covered by the existing diet.low-sodium group ('ללא מלח').","options":["להכניס","להכניס כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested":"להשאיר","collapsedDefault":false},{"id":"kind:yogurt-drink","section":1,"title":"משקה יוגורט לשתייה (yogurt-drink)","meta":"45 מוצרים · ירקות ופירות / חלב וביצים / בשר ועוף / מעדנייה · unsure/low","body":"ayran: איירנ, ayran\n\nאיירן (Ayran) is a urt mirrors the cow's-milk split that already exists as two separate concepts (yogurt-plain/yogurt-natural vs yogurt-drink); here both formats share one concept.","options":["להכניס","להכניס כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested":null,"collapsedDefault":false},{"id":"kind:tvorog-cheese","section":1,"title":"גבינת טבורוג (tvorog-cheese)","meta":"20 מוצרים · ירקות ופירות / חלב וביצים / בשר ועוף / מעדנייה · unsure/medium","body":"dessert: קינוח\n\nקינוח טבורוג (a sweetened fruit tvorog dessert cup) is a ready-to-eat dessert, different from plain tvorog sold as a cooking/eating cheese.","options":["להכניס","להכניס כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested":"להשאיר","collapsedDefault":false},{"id":"kind:chocolate-milk-drink","section":1,"title":"שוקו (chocolate-milk-drink)","meta":"19 מוצרים · ירקות ופירות / חלב וביצים / בשר ועוף / מעדנייה · unsure/low","body":"soy-based: סויה\n\nSoy-based chocolate milk is plant-based; most of these are already caught by the global diet.vegan pattern when labelled טבעוני, but a couple just say סויה without that word, so flagging as unsure at low volume (3/19).","options":["להכניס","להכניס כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested":"להשאיר","collapsedDefault":false},{"id":"kind:margarine","section":1,"title":"מרגרינה (margarine)","meta":"10 מוצרים · ירקות ופירות / חלב וביצים / בשר ועוף / מעדנייה · unsure/low","body":"baking: לאפי, ובישול\n\nמרגרינה לאפיה ובישול (for baking/cooking) is a firmer block product distinct from spreadable table margarine; signal is mixed since one listing uses both 'למריחה' and 'בישול' together, so flagging as unsure.","options":["להכניס","להכניס כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested":"להשאיר","collapsedDefault":false},{"id":"kind:white-cheese-other","section":1,"title":"גבינה לבנה (white-cheese-other)","meta":"8 מוצרים · ירקות ופירות / חלב וביצים / בשר ועוף / מעדנייה · unsure/low","body":"mascarpone: מסקרפונה\n\nמסקרפונה (mascarpone, triple-cream Italian dessert cheese) is functionally very different from plain low-fat white cooking cheese lumped into this catch-all concept; low volume (2/8).","options":["להכניס","להכניס כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested":"להשאיר","collapsedDefault":false},{"id":"kind:veggie-meat-chunks","section":1,"title":"נתחי בשר מהצומח (veggie-meat-chunks)","meta":"12 מוצרים · ירקות ופירות / חלב וביצים / בשר ועוף / מעדנייה · kinds/medium","body":"beef-flavor: (?<![א-ת])בקר\nchicken-flavor: עופ\nshawarma-flavor: שווארמה\n\nנתחונים ... בטעם בקר/עוף/שווארמה tag the plant-protein chunk with a specific meat it mimics - the same species-kind pattern already handled via variant.concepts for real meat (kebab-frozen, pastrami-other, sausage-other) should apply to its plant-based mimics too.","options":["להכניס","להכניס כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested":"להכניס","collapsedDefault":false},{"id":"kind:schnitzel-veggie","section":1,"title":"שניצל צמחוני (schnitzel-veggie)","meta":"12 מוצרים · ירקות ופירות / חלב וביצים / בשר ועוף / מעדנייה · kinds/medium","body":"broccoli: ברוקולי\ncauliflower: כרובית\nseitan: סייטנ\n\nברוקולי/כרובית/סייטן name genuinely different base vegetables/proteins for the patty, not flavours - a broccoli schnitzel and a cauliflower schnitzel taste and look different and a shopper picks on purpose.","options":["להכניס","להכניס כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested":"להכניס","collapsedDefault":false},{"id":"kind:lettuce","section":1,"title":"חסה (lettuce)","meta":"136 מוצרים · ירקות ופירות / חלב וביצים / בשר ועוף / מעדנייה · unsure/low","body":"romaine: קיסר, רומית, לבבות\niceberg: אייסברג, (?<![א-ת])עגולה\nradicchio: וורדג\nbok-choy: צ.?וי\n\nלאליק/סלנובה/לליק are cultivar/supplier brand names (substitutable loose-leaf lettuce), but קיסר/רומית/לבבות (romaine), אייסברג/עגולה (iceberg), וורדג'יו (red radicchio-type, bitter) and באק צ'וי (bok choy - a different vegetable entirely, possibly miscategorized here) are meaningfully different leaf types. Flagging as unsure given the size and mix of this concept rather than committing outright.","options":["להכניס","להכניס כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested":"להשאיר","collapsedDefault":false},{"id":"kind:carrot","section":1,"title":"גזר (carrot)","meta":"24 מוצרים · ירקות ופירות / חלב וביצים / בשר ועוף / מעדנייה · unsure/low","body":"korean-prepared: קוריאני\n\nגזר קוריאני / גזר בסגנון קוריאני is a marinated ready-to-eat deli salad, not raw carrot for cooking - a shopper buying one would not want the other. Note: this concept also contains several 'דיפנד' adult-diaper and 'מכנסוני ספיגה' absorbent-pants listings, plus a 'מסחטת גזר' juicer appliance - all clearly miscategorized (token collision between גזר and גזרה/גזרתיים), not kinds.","options":["להכניס","להכניס כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested":"להשאיר","collapsedDefault":false},{"id":"kind:frozen-vegetables","section":1,"title":"ירקות קפואים (frozen-vegetables)","meta":"114 מוצרים · ירקות ופירות / חלב וביצים / בשר ועוף / מעדנייה · unsure/medium","body":"pea: אפונה\ncauliflower: כרובית\nbroccoli: ברוקולי\nbeans: שעועית\nedamame: אדממה, (?<![א-ת])סויה\n\nUnlike frozen-fruit (where mango/strawberry/berries are already covered as generic flavour words), vegetable names like אפונה/כרובית/ברוקולי/שעועית/אדממה are NOT in the flavour word list, so nothing today stops a frozen-pea product from matching a frozen-cauliflower one. The catch-all nature of this concept (many single-vegetable types bundled with mixes) makes a clean exclusive-group fit imperfect - flagging as unsure and naming the five most common standalone vegetables; a cleaner long-term fix may be splitting into per-vegetable concepts the way mushroom-button/mushroom-mix/mushroom-portobello already are.","options":["להכניס","להכניס כברירת מחדל (defaultKind)","לפצל למושג נפרד","להשאיר"],"suggested"   var state = {}; // id -> { answer, note, at }
  var db = null;
  var writeChains = {}; // id -> promise chain, to serialize writes per doc

  /* ---- local storage (always guarded) ---- */
  function loadLocal() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveLocal() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignored on purpose */ }
  }

  state = loadLocal();

  /* ---- shared db (claude.ai artifact 'db' capability) ----
     Mirrors tools/review/same-product.html: window.claude has only `use`, it resolves later than
     the first script run, and may be null (local file / outside the artifact runtime) - the page
     must keep working on localStorage alone in that case. We never seed data into the db from here;
     we only read what viewers already wrote and write a doc when a tap changes it. */
  function setConnPill(ok) {
    var el = document.getElementById('connPill');
    if (ok) { el.textContent = 'מחובר לשמירה משותפת'; el.classList.add('ok'); }
    else { el.textContent = 'לא מחובר לשמירה משותפת'; el.classList.remove('ok'); }
  }

  function applyRemoteDoc(docSnap) {
    var exists = docSnap && (docSnap.exists === undefined ? true : (typeof docSnap.exists === 'function' ? docSnap.exists() : docSnap.exists));
    if (!exists) return;
    var v = (typeof docSnap.data === 'function') ? docSnap.data() : docSnap;
    if (!v) return;
    var id = docSnap.id || v.id;
    if (!id) return;
    var cur = state[id];
    if (!cur || String(v.at || '') > String(cur.at || '')) {
      state[id] = { answer: v.answer || null, note: v.note || '', at: v.at || null };
    }
  }

  function subscribeDb() {
    if (!db) return;
    try {
      var coll = db.collection('answers');
      if (coll && typeof coll.onSnapshot === 'function') {
        coll.onSnapshot(function (snap) {
          (snap.docs || []).forEach(applyRemoteDoc);
          saveLocal();
          renderAll();
        }, function () { /* subscription error - local state stands */ });
      } else if (coll && typeof coll.get === 'function') {
        coll.get().then(function (snap) {
          (snap.docs || []).forEach(applyRemoteDoc);
          saveLocal();
          renderAll();
        }).catch(function () {});
      }
    } catch (e) { /* db unusable this session - local storage stands */ }
  }

  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('db').then(function (d) {
      db = d;
      if (db) { setConnPill(true); subscribeDb(); }
    }).catch(function () { /* no db capability - local-only */ });
  }

  function writeDoc(id, payload) {
    if (!db) return;
    var prev = writeChains[id] || Promise.resolve();
    writeChains[id] = prev.then(function () {
      return db.doc('answers/' + id).set(payload).catch(function () { /* local copy stands */ });
    });
  }

  /* ---- helpers ---- */
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function isAnswered(id) { return !!(state[id] && state[id].answer); }

  function countAnswered(list) {
    var n = 0;
    for (var i = 0; i < list.length; i++) if (isAnswered(list[i].id)) n++;
    return n;
  }

  var currentFilter = 'all';

  function matchesFilter(item) {
    if (currentFilter === 'open') return !isAnswered(item.id);
    if (currentFilter === 'answered') return isAnswered(item.id);
    return true;
  }

  function cardHtml(item) {
    var st = state[item.id] || {};

  function sectionsHtml() {

    var total = ITEMS.length;
    var answered = countAnswered(ITEMS);
    document.getElementById('progressText').textContent = 'ענית על ' + answered + ' מתוך ' + total;
    document.getElementById('progressBarFill').style.width = (total ? (answered / total * 100) : 0) + '%';
    var anyVisible = ITEMS.some(matchesFilter);
    document.getElementById('emptyFilter').hidden = anyVisible;
    wireCardEvents();
  }

  function renderSectionChips() {
    var html = Object.keys(SECTION_META).map(function (n) {
      var list = ITEMS.filter(function (it) { return it.section == n; });
      return '<button class="chip" data-jump="section-' + n + '">סעיף ' + n + '<span class="n">(' + list.length + ')</span></button>';
    }).join('');
    document.getElementById('sectionChips').innerHTML = html;
  }

  /* ---- answering ---- */
  function setAnswer(id, opt) {
    var item = ITEMS.filter(function (it) { return it.id === id; })[0];
    if (!item) return;
    var cur = state[id] || {};
    if (cur.answer === opt) return; // no change, no write
    var next = { answer: opt, note: cur.note || '', at: new Date().toISOString() };
    state[id] = next;
    saveLocal();
    writeDoc(id, {
      answer: next.answer, note: next.note, at: next.at,
      itemTitle: item.title, section: item.section
    });
    renderAll();
    focusCard(id);
  }

  var noteTimers = {};
  function setNote(id, note) {
    var item = ITEMS.filter(function (it) { return it.id === id; })[0];
    if (!item) return;
    var cur = state[id] || {};
    if ((cur.note || '') === note) return;
    var next = { answer: cur.answer || null, note: note, at: new Date().toISOString() };
    state[id] = next;
    saveLocal();
    clearTimeout(noteTimers[id]);
    noteTimers[id] = setTimeout(function () {
      writeDoc(id, {
        answer: next.answer, note: next.note, at: next.at,
        itemTitle: item.title, section: item.section
      });
    }, 500);
  }

  function focusCard(id) {
    var el = document.querySelector('.card[data-id="' + id.replace(/"/g, '') + '"]');
    if (el) el.focus();
  }

  function wireCardEvents() {
    var sectionsEl = document.getElementById('sections');
    sectionsEl.querySelectorAll('.opt').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var card = btn.closest('.card');
        setAnswer(card.getAttribute('data-id'), btn.getAttribute('data-opt'));
      });
    });
    sectionsEl.querySelectorAll('.body-toggle').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var body = document.getElementById(btn.getAttribute('data-toggle'));
        var hidden = body.hasAttribute('hidden');
        if (hidden) { body.removeAttribute('hidden'); btn.textContent = 'הסתר פרטים ▴'; }
        else { body.setAttribute('hidden', ''); btn.textContent = 'פרטים ▾'; }
      });
    });
    sectionsEl.querySelectorAll('.note-input').forEach(function (inp) {
      inp.addEventListener('input', function () { setNote(inp.getAttribute('data-note-for'), inp.value); });
    });
  }

  /* ---- filter chips ---- */
  document.getElementById('filterChips').addEventListener('click', function (e) {
    var btn = e.target.closest('.chip');
    if (!btn) return;
    currentFilter = btn.getAttribute('data-filter');
    document.querySelectorAll('#filterChips .chip').forEach(function (c) { c.classList.toggle('active', c === btn); });
    renderAll();
  });

  document.getElementById('sectionChips').addEventListener('click', function (e) {
    var btn = e.target.closest('.chip');
    if (!btn) return;
    var target = document.getElementById(btn.getAttribute('data-jump'));
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  /* ---- keyboard: Enter accepts the suggested option; left/right move between visible cards ---- */
  window.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') {
      if (e.key === 'Enter') e.target.blur();
      return;
    }
    var focusedCard = document.activeElement && document.activeElement.closest && document.activeElement.closest('.card');
    if (e.key === 'Enter' && focusedCard) {
      var suggested = focusedCard.getAttribute('data-suggested');
      if (suggested) { e.preventDefault(); setAnswer(focusedCard.getAttribute('data-id'), suggested); }
      return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
      if (!cards.length) return;
      var idx = focusedCard ? cards.indexOf(focusedCard) : -1;
      var next;
      if (e.key === 'ArrowLeft') next = cards[Math.min(cards.length - 1, (idx < 0 ? -1 : idx) + 1)];
      else next = cards[Math.max(0, (idx < 0 ? 1 : idx) - 1)];
      if (next) { e.preventDefault(); next.focus(); next.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }
  });

  /* ---- boot ---- */
  renderSectionChips();
  renderAll();
})();
</script>
